<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3da358"/>
      <stop offset="100%" stop-color="#1a5227"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Hair -->
  <ellipse cx="50" cy="33" rx="26" ry="20" fill="#1a5227"/>
  <!-- Left leaf sprout -->
  <ellipse cx="28" cy="18" rx="6" ry="10" fill="#4caf50" transform="rotate(-30 28 18)"/>
  <!-- Right leaf sprout -->
  <ellipse cx="72" cy="18" rx="6" ry="10" fill="#4caf50" transform="rotate(30 72 18)"/>
  <!-- Face -->
  <ellipse cx="50" cy="52" rx="22" ry="24" fill="#fde8c8"/>
  <!-- Ears -->
  <ellipse cx="28" cy="52" rx="5" ry="7" fill="#fde8c8"/>
  <ellipse cx="72" cy="52" rx="5" ry="7" fill="#fde8c8"/>
  <!-- Eyes -->
  <circle cx="42" cy="47" r="3.5" fill="#1a5227"/>
  <circle cx="58" cy="47" r="3.5" fill="#1a5227"/>
  <circle cx="43" cy="46" r="1" fill="white"/>
  <circle cx="59" cy="46" r="1" fill="white"/>
  <!-- Rosy cheeks -->
  <ellipse cx="36" cy="56" rx="5" ry="3" fill="#f9a8a8" opacity="0.6"/>
  <ellipse cx="64" cy="56" rx="5" ry="3" fill="#f9a8a8" opacity="0.6"/>
  <!-- Smile -->
  <path d="M 42 62 Q 50 70 58 62" stroke="#c97b6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Freckles -->
  <circle cx="40" cy="59" r="1" fill="#c97b6e" opacity="0.5"/>
  <circle cx="44" cy="61" r="1" fill="#c97b6e" opacity="0.5"/>
  <circle cx="56" cy="61" r="1" fill="#c97b6e" opacity="0.5"/>
  <circle cx="60" cy="59" r="1" fill="#c97b6e" opacity="0.5"/>
</svg>
